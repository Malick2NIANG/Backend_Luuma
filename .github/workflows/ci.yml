name: Backend CI

"on":
  pull_request:
    branches:
      - develop
      - staging
      - preprod
      - main
  push:
    branches:
      - develop
      - staging
      - preprod
      - main

permissions:
  contents: read

jobs:
  build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build backend
        run: npm run build
